name: just_audio
description: A feature-rich audio player for Flutter. Loop, clip and sequence any sound from any source (asset/file/URL/stream) in gapless playlists.
version: 0.11.0
repository: https://github.com/ryanheise/just_audio/tree/minor/just_audio
issue_tracker: https://github.com/ryanheise/just_audio/issues
publish_to: 'none'
topics:
  - audio
  - sound
  - player
  - background

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  # just_audio_platform_interface: ^4.5.0
  just_audio_platform_interface:
    git:
      url: https://github.com/kishan-dhankecha/just_audio.git
      ref: visualizer
      path: just_audio_platform_interface
  # just_audio_web: ^0.4.15
  just_audio_web:
    git:
      url: https://github.com/kishan-dhankecha/just_audio.git
      ref: visualizer
      path: just_audio_web
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  path: ^1.9.1
  path_provider: ^2.1.5
  async: ^2.13.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  meta: ^1.16.0
  flutter:
    sdk: flutter
  synchronized: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.6
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ryanheise.just_audio
        pluginClass: JustAudioPlugin
      ios:
        pluginClass: JustAudioPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: JustAudioPlugin
        sharedDarwinSource: true
      web:
        default_package: just_audio_web
